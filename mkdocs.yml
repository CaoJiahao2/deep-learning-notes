site_name: 深度学习笔记 Deep Learning Notes
site_description: 全面、系统的深度学习笔记 —— 从数学基础到大模型部署
repo_url: https://github.com/CaoJiahao2/deep-learning-notes
repo_name: deep-learning-notes
edit_uri: blob/main/docs/

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - tables

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

nav:
  - 首页: index.md
  - 深度学习全景手册: fundamentals/panorama.md
  - 入门指南:
      - 学习路线图: getting-started/learning-roadmap.md
      - 环境配置: getting-started/environment-setup.md
  - 基础理论:
      - 数学基础: fundamentals/math-foundations.md
      - 机器学习概述: fundamentals/machine-learning.md
  - 模型架构:
      - Transformer: architectures/transformer.md
      - 卷积神经网络 CNN: architectures/cnn.md
      - 循环神经网络 RNN/LSTM/GRU: architectures/rnn-lstm.md
      - 生成对抗网络 GAN: architectures/gan.md
      - 扩散模型 Diffusion: architectures/diffusion.md
      - Flow Matching 与 Rectified Flow: architectures/flow-matching.md
      - 视频生成: architectures/video-generation.md
      - 可控图像生成: architectures/controllable-image-generation.md
      - 目标检测: architectures/object-detection.md
      - 图像分割: architectures/segmentation.md
      - 单目深度与 3D 视觉: architectures/monocular-depth.md
      - 现代架构演进 MoE/SSM: architectures/modern-architectures.md
  - 训练技术:
      - 完整训练流程: training/training-pipeline.md
      - 反向传播: training/backpropagation.md
      - 优化器详解: training/optimization.md
      - 正则化技术: training/regularization.md
