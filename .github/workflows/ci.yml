name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Node deps (KaTeX linter)
        run: npm ci

      - name: Lint math formulas (KaTeX)
        run: node scripts/check_math.mjs

      - name: Check nav/document consistency
        run: node scripts/check_nav.mjs

      - name: Build docs site
        run: mkdocs build --strict --site-dir site
